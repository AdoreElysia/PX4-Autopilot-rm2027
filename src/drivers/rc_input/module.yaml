module_name: RC Input Driver
parameters:
    - group: RC Input
      definitions:
        RC_INPUT_PROTO:
            description:
                short: RC input protocol
                long: |
                    Select your RC input protocol or auto to scan.
            category: System
            type: enum
            values:
                -1: Auto
                0: None
                1: PPM
                2: SBUS
                3: DSM
                4: ST24
                5: SUMD
                6: CRSF
                7: GHST
            min: -1
            max: 7
            default: -1

        RC_INPUT_INVERT:
            description:
                short: Invert the SBUS/W.BUS input signal
                long: |
                    When scanning SBUS (which also covers W.BUS and DJI DBUS)
                    the driver normally enables UART RX inversion, because
                    Futaba SBUS is an inverted signal.

                    Set this to 0 if the receiver outputs a NON-inverted
                    SBUS/W.BUS signal (for example a WFLY RF209S wired
                    directly to the RC input pin), so the driver reads the
                    signal without inverting it.
            category: System
            type: boolean
            default: 1

serial_config:
    - command: set RC_INPUT_ARGS "-d ${SERIAL_DEV}"
      port_config_param:
        name: RC_PORT_CONFIG
        group: Serial
        default: RC
        description_extended: |
            Setting this to 'Disabled' will use a board-specific default port
            for RC input.
